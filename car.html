<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل السيارة — Automobile Elkheshen</title><link rel="stylesheet" href="/styles.css"><style>
.car-page{min-height:100vh;background:#faf8fc;padding-bottom:60px}.car-top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #eadff0}.car-top-inner{max-width:1180px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.back-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none}.car-wrap{max-width:1180px;margin:30px auto;padding:0 22px}.car-detail-page{background:#fff;border:1px solid #eadff0;border-radius:28px;overflow:hidden;box-shadow:0 18px 60px rgba(54,20,70,.08)}.car-gallery{display:grid;grid-template-columns:1fr 145px;gap:12px;padding:18px}.car-main-image{width:100%;height:min(62vh,610px);object-fit:cover;border-radius:20px;background:#f2eef5}.car-thumbs{display:grid;align-content:start;gap:10px;max-height:610px;overflow:auto}.car-thumb-btn{border:2px solid transparent;background:#fff;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:1}.car-thumb-btn.active{border-color:#b94de0}.car-thumb-btn img{width:100%;height:100%;object-fit:cover}.car-info{padding:10px 28px 32px}.car-info h1{font-size:clamp(28px,4vw,52px);margin:0 0 10px}.car-price-big{font-size:clamp(25px,3vw,38px);font-weight:950;color:#a93ed0;margin:12px 0 22px}.car-spec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.car-spec-box{border:1px solid #eadff0;border-radius:15px;padding:14px;background:#fcf9fd}.car-spec-box span{display:block;color:#777;font-size:11px;margin-bottom:5px}.car-spec-box b{font-size:14px}.car-description{margin-top:22px;padding-top:20px;border-top:1px solid #eee}.car-description h2{margin:0 0 10px}.car-description p{line-height:2;color:#555;white-space:pre-wrap}.car-actions-big{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.car-actions-big .btn{min-width:210px}.sold-big{background:#fff0f1!important;color:#b02e39!important;border-color:#f0d3d7!important}@media(max-width:760px){.car-gallery{grid-template-columns:1fr}.car-main-image{height:55vh}.car-thumbs{grid-template-columns:repeat(5,1fr);display:grid;max-height:none}.car-info{padding:10px 18px 25px}.car-spec-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="car-page"><header class="car-top"><div class="car-top-inner"><a class="btn back-btn" href="/">→ العودة للسيارات</a><strong>Automobile Elkheshen</strong></div></header><main class="car-wrap"><section id="carDetail" class="car-detail-page"><div class="loading">جاري تحميل تفاصيل السيارة...</div></section></main></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id');let current=[];
function money(v){return Number(v||0).toLocaleString('ar-EG')+' ج.م'}
function images(p){return Array.isArray(p.images)&&p.images.length?p.images.filter(Boolean):[p.image].filter(Boolean)}
async function init(){const box=document.querySelector('#carDetail');if(!id){box.innerHTML='<div class="empty">الإعلان غير موجود.</div>';return}try{const r=await fetch('/api/products',{cache:'no-store'});if(!r.ok)throw Error();const all=await r.json();const p=all.find(x=>String(x.id)===String(id));if(!p){box.innerHTML='<div class="empty">الإعلان غير موجود أو تم حذفه.</div>';return}current=images(p);render(p)}catch(e){box.innerHTML='<div class="empty">تعذر تحميل تفاصيل السيارة حاليًا.</div>'}}
function render(p){const sold=p.status==='sold';const pic=current[0]||'';document.title=(p.name||'تفاصيل السيارة')+' — Automobile Elkheshen';document.querySelector('#carDetail').innerHTML=`<div class="car-gallery"><div><img id="mainCarImage" class="car-main-image" src="${esc(pic)}" alt="${esc(p.name)}"></div><div class="car-thumbs">${current.map((x,i)=>`<button class="car-thumb-btn ${i===0?'active':''}" onclick="showImg(${i})"><img src="${esc(x)}" alt=""></button>`).join('')}</div></div><div class="car-info"><span class="eyebrow">AUTOMOBILE ELKHESHEN • ${sold?'SOLD':'AVAILABLE'}</span><h1>${esc(p.name)}</h1><div class="car-price-big">${money(p.price)}</div><div class="car-spec-grid"><div class="car-spec-box"><span>السنة</span><b>${esc(p.year||'—')}</b></div><div class="car-spec-box"><span>العداد</span><b>${Number(p.mileage||0).toLocaleString('ar-EG')} كم</b></div><div class="car-spec-box"><span>ناقل الحركة</span><b>${esc(p.transmission||'أوتوماتيك')}</b></div><div class="car-spec-box"><span>الوقود</span><b>${esc(p.fuel||'بنزين')}</b></div></div><div class="car-description"><h2>تفاصيل الإعلان</h2><p>${esc(p.description||'لم يتم إضافة وصف تفصيلي للسيارة.')}</p></div><div class="car-actions-big">${sold?'<button class="btn sold-big" disabled>السيارة مباعة</button>':'<a class="btn btn-primary" href="https://wa.me/201119295523" target="_blank" rel="noopener">استفسر عن السيارة واتساب</a>'}<a class="btn" href="tel:01119295523">اتصل بنا</a></div></div>`}
function showImg(i){if(!current[i])return;document.querySelector('#mainCarImage').src=current[i];document.querySelectorAll('.car-thumb-btn').forEach((b,n)=>b.classList.toggle('active',n===i))}init();
</script></body></html>
