<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Automobile Elkheshen</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--p:#6d2388;--bg:#f6f4f7;--line:#e7e2e9;--ink:#171219}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,Arial;color:var(--ink)}.bar{height:72px;background:#151016;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.bar b{color:#d78eef}.wrap{max-width:1200px;margin:30px auto;padding:0 18px}.login,.panel{background:#fff;border:1px solid var(--line);box-shadow:0 15px 45px rgba(0,0,0,.06);padding:26px;border-radius:4px}.login{max-width:460px;margin:100px auto}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:11px;font-weight:800}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);font:500 12px Cairo;background:#fff}.field textarea{min-height:90px;resize:vertical}.btn{border:0;padding:12px 18px;background:var(--p);color:#fff;font:800 12px Cairo;cursor:pointer;border-radius:3px}.btn.alt{background:#eee;color:#222}.btn.danger{background:#a51d2d}.hidden{display:none!important}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.head h1{margin:0;font-size:25px}.cars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.car{border:1px solid var(--line);background:#fff}.car img{width:100%;height:180px;object-fit:cover}.car-body{padding:15px}.car-body h3{margin:0 0 5px;font-size:16px}.muted{color:#777;font-size:10px}.actions{display:flex;gap:7px;margin-top:12px}.actions .btn{padding:8px 11px;font-size:10px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.upload{border:2px dashed #d8cce0;padding:18px;text-align:center}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.thumbs img{width:90px;height:65px;object-fit:cover}.msg{padding:10px;background:#f1edf3;margin-bottom:15px;font-size:11px}@media(max-width:800px){.cars{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}}@media(max-width:520px){.cars{grid-template-columns:1fr}.bar{padding:0 15px}}
</style></head><body><header class="bar"><b>AUTOMOBILE ELKHESHEN · ADMIN</b><a href="/">الموقع ↗</a></header><main class="wrap"><section id="login" class="login"><h2>دخول لوحة الإدارة</h2><p class="muted">أدخل كلمة مرور الإدارة.</p><div class="field"><label>كلمة المرور</label><input id="pass" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">دخول</button><div id="loginMsg"></div></section><section id="app" class="hidden"><div class="head"><div><h1>السيارات</h1><span class="muted">إضافة وتعديل وحذف وتغيير حالة السيارة</span></div><button class="btn" id="newBtn">+ إضافة سيارة</button></div><div id="msg"></div><div id="cars" class="cars"></div></section><section id="editor" class="panel hidden" style="margin-top:20px"><div class="head"><h2 id="editTitle">إضافة سيارة</h2><button class="btn alt" id="cancelBtn">إلغاء</button></div><form id="form"><input type="hidden" id="id"><div class="form-grid"><div class="field"><label>اسم السيارة *</label><input id="name" required></div><div class="field"><label>السعر *</label><input id="price" type="number" min="0" required></div><div class="field"><label>السنة</label><input id="year"></div><div class="field"><label>التصنيف</label><select id="category"><option value="sedan">سيدان</option><option value="suv">SUV</option><option value="other">أخرى</option></select></div><div class="field"><label>الفتيس</label><input id="transmission" placeholder="أوتوماتيك"></div><div class="field"><label>الوقود</label><input id="fuel" placeholder="بنزين"></div><div class="field"><label>الكيلومترات</label><input id="mileage"></div><div class="field"><label>اللون</label><input id="color"></div><div class="field"><label>الحالة</label><select id="status"><option value="available">متاحة</option><option value="sold">مباعة</option></select></div><div class="field full"><label>الوصف</label><textarea id="description"></textarea></div><div class="field full upload"><label>صور السيارة — اختر حتى 12 صورة</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div id="thumbs" class="thumbs"></div><small class="muted">كل صورة حتى 2MB.</small></div><div class="full"><button class="btn" id="saveBtn">حفظ السيارة</button></div></div></form></section></main><script src="/admin.js"></script></body></html>
